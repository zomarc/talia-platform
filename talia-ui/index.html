<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="talia-app-version" content="0.2.1" />
    <title>Talia UI - Business Intelligence Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Pacifico&family=Press+Start+2P&family=Source+Sans+3:wght@400;500;600;700&family=Source+Sans+Pro:wght@400;600;700&family=Bangers&display=swap"
      rel="stylesheet"
    />
    <!-- Critical theme CSS - loaded synchronously before React to prevent FOUC -->
    <style>
      :root {
        /* Default theme variables - Dark Modern (data theme) */
        --theme-bg: linear-gradient(135deg, #0a0a1a 0%, #151528 50%, #1a1a2e 100%);
        --theme-bg-solid: #151528;
        --theme-fg: #e8e8f0;
        --theme-text-secondary: rgba(232, 232, 240, 0.75);
        --theme-text-muted: rgba(232, 232, 240, 0.55);
        --theme-sidebar: rgba(255, 255, 255, 0.05);
        --theme-sidebar-border: rgba(255, 255, 255, 0.12);
        --theme-sidebar-header: rgba(255, 255, 255, 0.08);
        --theme-accent: #5b9bd5;
        --theme-accent-hover: #4a8bc2;
        --theme-accent-light: rgba(91, 155, 213, 0.15);
        --theme-glass: rgba(255, 255, 255, 0.08);
        --theme-glass-border: rgba(255, 255, 255, 0.15);
        --theme-glass-hover: rgba(255, 255, 255, 0.12);
        --theme-border: rgba(255, 255, 255, 0.15);
        --theme-hover: rgba(91, 155, 213, 0.25);
        --theme-selected: rgba(91, 155, 213, 0.15);
        --theme-table-row-even: transparent;
        --theme-table-row-odd: rgba(0, 0, 0, 0.2);
        --theme-table-row-hover: rgba(66, 133, 244, 0.5);
        --theme-table-row-selected: rgba(66, 133, 244, 0.25);
        --theme-table-row-selected-hover: rgba(66, 133, 244, 0.6);
        
        /* Font settings - defaults */
        --theme-font-size: 12px;
        --theme-font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --theme-font-family-monospace: monospace;
        
        /* Table-specific font settings */
        --theme-table-font-size: 10px;
        --theme-table-font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --theme-table-header-font-size: 10px;
        --theme-table-header-font-weight: 600;
        --theme-table-header-height: 28px;
        --theme-table-row-height: 24px;
        
        /* Tabulator-specific theme variables */
        --theme-tabulator-header-bg: rgba(255, 255, 255, 0.08);
        --theme-tabulator-header-text: rgba(232, 232, 240, 0.75);
        --theme-tabulator-filter-bg: #151528;
        --theme-tabulator-filter-border: rgba(255, 255, 255, 0.15);
        --theme-tabulator-sort-active: #5b9bd5;
        --theme-tab-strip-bg: rgba(255, 255, 255, 0.04);
        --theme-tab-inactive-bg: rgba(176, 141, 87, 0.14);
        --theme-tab-hover-bg: rgba(176, 141, 87, 0.24);
        --theme-tab-active-bg: rgba(176, 141, 87, 0.45);
        --theme-tab-border: rgba(176, 141, 87, 0.28);
        --theme-tab-inactive-fg: rgba(176, 141, 87, 0.62);
        --theme-tab-active-accent: rgba(176, 141, 87, 0.92);
        --theme-tab-header-font-size: 10px;
        --theme-tab-action-size: 18px;
        --theme-tab-row-height: 32px;
      }
      
      /* Apply dark theme to body immediately */
      html, body {
        height: 100%;
      }
      body {
        background: var(--theme-bg);
        background-color: var(--theme-bg-solid);
        color: var(--theme-fg);
        margin: 0;
        padding: 0;
        font-family: var(--theme-font-family);
        font-size: var(--theme-font-size);
      }

      /*
        Boot splash — paints with index.html before the JS module graph loads.
        React replaces #root on mount, so this disappears automatically.
      */
      #root {
        min-height: 100%;
      }
      .talia-boot {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: var(--theme-bg);
        background-color: var(--theme-bg-solid);
        color: var(--theme-fg);
      }
      .talia-boot__brand {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--theme-fg);
      }
      .talia-boot__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--theme-border);
        border-top-color: var(--theme-accent);
        border-radius: 50%;
        animation: talia-boot-spin 0.8s linear infinite;
      }
      .talia-boot__message {
        margin: 0;
        font-size: 0.875rem;
        color: var(--theme-text-muted);
      }
      .talia-boot__detail {
        margin: 0;
        max-width: 28rem;
        font-size: 0.75rem;
        line-height: 1.45;
        color: var(--theme-text-secondary);
      }
      .talia-boot__meta {
        margin: 4px 0 0;
        font-size: 0.7rem;
        letter-spacing: 0.02em;
        color: var(--theme-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .talia-boot__warn {
        margin: 8px 0 0;
        max-width: 28rem;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, #e2a336 45%, transparent);
        background: color-mix(in srgb, #e2a336 12%, transparent);
        color: var(--theme-fg);
        font-size: 0.75rem;
        line-height: 1.45;
        text-align: left;
      }
      .talia-boot__warn[hidden] {
        display: none;
      }
      @keyframes talia-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="talia-boot" id="talia-boot" role="status" aria-live="polite" aria-busy="true">
        <p class="talia-boot__brand">Talia</p>
        <div class="talia-boot__spinner" aria-hidden="true"></div>
        <p class="talia-boot__message" id="talia-boot-message">Loading application…</p>
        <p class="talia-boot__detail" id="talia-boot-detail">Starting UI…</p>
        <p class="talia-boot__meta" id="talia-boot-meta"></p>
        <div class="talia-boot__warn" id="talia-boot-warn" hidden></div>
      </div>
    </div>
    <script>
      (function () {
        var started = Date.now();
        var messageEl = document.getElementById('talia-boot-message');
        var detailEl = document.getElementById('talia-boot-detail');
        var metaEl = document.getElementById('talia-boot-meta');
        var warnEl = document.getElementById('talia-boot-warn');
        var versionMeta = document.querySelector('meta[name="talia-app-version"]');
        var version = (versionMeta && versionMeta.getAttribute('content')) || 'unknown';
        var host = location.host || 'local';
        var scriptSrc = '';
        var scripts = document.getElementsByTagName('script');
        for (var i = 0; i < scripts.length; i++) {
          if (scripts[i].src) scriptSrc = scripts[i].src;
        }
        var isViteDev = /\/src\/main\.|\/@vite\/client/.test(scriptSrc)
          || document.querySelector('script[src*="/src/main"]') != null
          || document.querySelector('script[src*="@vite/client"]') != null;
        var modeLabel = isViteDev ? 'vite-dev (module graph)' : 'production bundle';
        var failed = [];

        function setDetail(text) {
          if (detailEl) detailEl.textContent = text;
        }
        function setMessage(text) {
          if (messageEl) messageEl.textContent = text;
        }
        function renderMeta() {
          var secs = ((Date.now() - started) / 1000).toFixed(1);
          if (metaEl) {
            metaEl.textContent = 'v' + version + ' · ' + host + ' · ' + modeLabel + ' · ' + secs + 's';
          }
        }
        function showWarn(html) {
          if (!warnEl) return;
          warnEl.hidden = false;
          warnEl.innerHTML = html;
        }

        renderMeta();
        setDetail(isViteDev
          ? 'Fetching Vite modules over the public tunnel…'
          : 'Loading bundled assets…');

        window.addEventListener('error', function (event) {
          var src = (event && event.filename) || (event && event.target && event.target.src) || '';
          if (src) failed.push(String(src).replace(location.origin, ''));
          if (failed.length) {
            showWarn(
              '<strong>Asset load problem</strong><br/>'
              + failed.slice(-3).join('<br/>')
            );
          }
        }, true);

        var timer = window.setInterval(function () {
          if (!document.getElementById('talia-boot')) {
            window.clearInterval(timer);
            return;
          }
          var elapsed = Date.now() - started;
          renderMeta();
          if (elapsed > 4000 && elapsed <= 12000) {
            setMessage('Still loading…');
            setDetail(isViteDev
              ? 'Public tunnel + Vite-dev loads hundreds of files. This often stalls.'
              : 'Waiting for JS bundle / auth bootstrap…');
          }
          if (elapsed > 12000) {
            setMessage('Taking longer than expected');
            if (isViteDev) {
              showWarn(
                '<strong>Vite-dev over ngrok is unreliable</strong><br/>'
                + 'taliahub.com should serve a local <code>vite preview</code> build, not <code>npm run dev</code>. '
                + 'Local editing can stay on <code>http://127.0.0.1:5173</code>.'
              );
            } else {
              showWarn(
                '<strong>Bundle loaded slowly or auth is waiting</strong><br/>'
                + 'Check GraphQL on <code>/api/graphql</code> and Supabase, then hard-refresh.'
              );
            }
          }
        }, 500);

        window.__taliaBoot = {
          startedAt: started,
          version: version,
          mode: isViteDev ? 'vite-dev' : 'preview',
          host: host
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
