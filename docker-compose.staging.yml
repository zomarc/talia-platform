# Docker Compose configuration for Staging Environment
# This file is used on the staging server (MiniPC)

services:
  # Supabase Services (same as local)
  supabase-db:
    image: public.ecr.aws/supabase/postgres:15.1.0.147
    container_name: talia-supabase-db
    user: "101:101"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  supabase-studio:
    image: public.ecr.aws/supabase/studio:20240118-8c99c0d
    container_name: talia-supabase-studio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/profile', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-pg-meta:8080
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      DEFAULT_ORGANIZATION_NAME: Default Organization
      DEFAULT_PROJECT_NAME: Default Project
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: http://192.168.1.120:54321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiYXVkIjoiYXV0aGVudGljYXRlZCIsImlhdCI6MTc2ODk0NTkzMSwiZXhwIjoxODAwNTAzNTMxfQ.L-fOEUmTqH8DSkBJHgEz39E-gf7MTv5kmFFeqc2wDRQ
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJhdWQiOiJhdXRoZW50aWNhdGVkIiwiaWF0IjoxNzY4OTQ1OTMxLCJleHAiOjE4MDA1MDM1MzF9._yzlWcAjdzK_UKA0TbY6wJ7RQuk5waO6cag4WXCt2qo
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    container_name: talia-supabase-kong
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - supabase-db

  supabase-auth:
    image: public.ecr.aws/supabase/gotrue:v2.99.0
    container_name: talia-supabase-auth
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:your-super-secret-and-long-postgres-password@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3000,http://localhost:3000,https://taliahub.com
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_MAILER_AUTOCONFIRM: true

  supabase-rest:
    image: public.ecr.aws/supabase/postgrest:v12.0.1
    container_name: talia-supabase-rest
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:your-super-secret-and-long-postgres-password@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  supabase-realtime:
    image: public.ecr.aws/supabase/realtime:v2.57.3
    container_name: talia-supabase-realtime
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "printf \\0 > /dev/tcp/localhost/4000"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: your-super-secret-and-long-postgres-password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "100000"
    command: >
      sh -c "/app/bin/realtime eval 'Realtime.Release.migrate()' &&
      /app/bin/realtime start"

  supabase-storage:
    image: public.ecr.aws/supabase/storage-api:v1.28.2
    container_name: talia-supabase-storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiYXVkIjoiYXV0aGVudGljYXRlZCIsImlhdCI6MTc2ODk0NTkzMSwiZXhwIjoxODAwNTAzNTMxfQ.L-fOEUmTqH8DSkBJHgEz39E-gf7MTv5kmFFeqc2wDRQ
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJhdWQiOiJhdXRoZW50aWNhdGVkIiwiaWF0IjoxNzY4OTQ1OTMxLCJleHAiOjE4MDA1MDM1MzF9._yzlWcAjdzK_UKA0TbY6wJ7RQuk5waO6cag4WXCt2qo
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://supabase_storage_admin:your-super-secret-and-long-postgres-password@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase-imgproxy:5001

  supabase-imgproxy:
    image: public.ecr.aws/supabase/imgproxy:v3.8.0
    container_name: talia-supabase-imgproxy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}

  supabase-pg-meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.80.0
    container_name: talia-supabase-pg-meta
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: your-super-secret-and-long-postgres-password

  # GraphQL Server
  graphql-server:
    build:
      context: ./talia-server
      dockerfile: Dockerfile
    container_name: talia-graphql-server
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiYXVkIjoiYXV0aGVudGljYXRlZCIsImlhdCI6MTc2ODk0NTkzMSwiZXhwIjoxODAwNTAzNTMxfQ.L-fOEUmTqH8DSkBJHgEz39E-gf7MTv5kmFFeqc2wDRQ
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJhdWQiOiJhdXRoZW50aWNhdGVkIiwiaWF0IjoxNzY4OTQ1OTMxLCJleHAiOjE4MDA1MDM1MzF9._yzlWcAjdzK_UKA0TbY6wJ7RQuk5waO6cag4WXCt2qo
      AZURE_SYNAPSE_SERVER: celestyaldataplatform-prd.sql.azuresynapse.net
      AZURE_SYNAPSE_PORT: 1433
      AZURE_SYNAPSE_DATABASE: CDP_Dedicated_SQL_DWH
      AZURE_SYNAPSE_USERNAME: RBryer
      AZURE_SYNAPSE_PASSWORD: Cele5tyalrbUser!
      DATA_SOURCE_PRIORITY: supabase
    depends_on:
      supabase-kong:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http'); const data=JSON.stringify({query:'query { __typename }'}); const req=http.request({host:'localhost',port:4000,method:'POST',path:'/graphql',headers:{'content-type':'application/json','content-length':Buffer.byteLength(data)}}, res=>{process.exit(res.statusCode===200?0:1)}); req.on('error',()=>process.exit(1)); req.write(data); req.end();\""
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # UI
  ui:
    build:
      context: ./talia-ui
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: http://192.168.1.120:54321
        VITE_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        VITE_GRAPHQL_ENDPOINT: http://192.168.1.120:4000/graphql
        VITE_ENABLE_DEV_MODE: "true"
    container_name: talia-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      graphql-server:
        condition: service_healthy

volumes:
  supabase-db-data:
