<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talia UI - Business Intelligence Dashboard</title>
    <!-- Critical theme CSS - loaded synchronously before React to prevent FOUC -->
    <style>
      :root {
        /* Default theme variables - Dark Modern (data theme) */
        --theme-bg: linear-gradient(135deg, #0a0a1a 0%, #151528 50%, #1a1a2e 100%);
        --theme-bg-solid: #151528;
        --theme-fg: #e8e8f0;
        --theme-text-secondary: rgba(232, 232, 240, 0.75);
        --theme-text-muted: rgba(232, 232, 240, 0.55);
        --theme-sidebar: rgba(255, 255, 255, 0.05);
        --theme-sidebar-border: rgba(255, 255, 255, 0.12);
        --theme-sidebar-header: rgba(255, 255, 255, 0.08);
        --theme-accent: #5b9bd5;
        --theme-accent-hover: #4a8bc2;
        --theme-accent-light: rgba(91, 155, 213, 0.15);
        --theme-glass: rgba(255, 255, 255, 0.08);
        --theme-glass-border: rgba(255, 255, 255, 0.15);
        --theme-glass-hover: rgba(255, 255, 255, 0.12);
        --theme-border: rgba(255, 255, 255, 0.15);
        --theme-hover: rgba(91, 155, 213, 0.25);
        --theme-selected: rgba(91, 155, 213, 0.15);
        --theme-table-row-even: transparent;
        --theme-table-row-odd: rgba(0, 0, 0, 0.2);
        --theme-table-row-hover: rgba(66, 133, 244, 0.5);
        --theme-table-row-selected: rgba(66, 133, 244, 0.25);
        --theme-table-row-selected-hover: rgba(66, 133, 244, 0.6);
        
        /* Font settings - defaults */
        --theme-font-size: 12px;
        --theme-font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --theme-font-family-monospace: monospace;
        
        /* Table-specific font settings */
        --theme-table-font-size: 10px;
        --theme-table-font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --theme-table-header-font-size: 10px;
        --theme-table-header-font-weight: 600;
        --theme-table-header-height: 28px;
        --theme-table-row-height: 24px;
      }
      
      /* Apply dark theme to body immediately */
      body {
        background: var(--theme-bg);
        color: var(--theme-fg);
        margin: 0;
        padding: 0;
        font-family: var(--theme-font-family);
        font-size: var(--theme-font-size);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
