services:
  # Supabase Database
  supabase-db:
    container_name: talia-supabase-db
    image: public.ecr.aws/supabase/postgres:17.6.1.029
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Studio
  supabase-studio:
    container_name: talia-supabase-studio
    image: public.ecr.aws/supabase/studio:2025.10.27-sha-85b84e0
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/profile', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-pg-meta:8080
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION_NAME: Talia
      DEFAULT_PROJECT_NAME: Talia Platform
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-pg-meta:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Postgres Meta
  supabase-pg-meta:
    container_name: talia-supabase-pg-meta
    image: public.ecr.aws/supabase/postgres-meta:v0.93.1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "8080:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Kong API Gateway
  supabase-kong:
    container_name: talia-supabase-kong
    image: public.ecr.aws/supabase/kong:2.8.1
    ports:
      - "54321:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Auth
  supabase-auth:
    container_name: talia-supabase-auth
    image: public.ecr.aws/supabase/gotrue:v2.180.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://192.168.1.120:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://192.168.1.120:54321
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase REST API
  supabase-rest:
    container_name: talia-supabase-rest
    image: public.ecr.aws/supabase/postgrest:v13.0.7
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Realtime
  supabase-realtime:
    container_name: talia-supabase-realtime
    image: public.ecr.aws/supabase/realtime:v2.57.3
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Storage
  supabase-storage:
    container_name: talia-supabase-storage
    image: public.ecr.aws/supabase/storage-api:v1.28.2
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://postgres:postgres@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
    volumes:
      - supabase-storage-data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    restart: unless-stopped
    networks:
      - talia-network

  # Supabase Inbucket (Email testing)
  supabase-inbucket:
    container_name: talia-supabase-inbucket
    image: public.ecr.aws/supabase/mailpit:v1.22.3
    ports:
      - "54324:8025"
    restart: unless-stopped
    networks:
      - talia-network

  # GraphQL Server
  graphql-server:
    container_name: talia-graphql-server
    build:
      context: ./talia-server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"  # GraphQL endpoint
      - "4001:4001"  # SSE endpoint
    environment:
      NODE_ENV: production
      # Use internal Docker network for Supabase connection (bypass Kong, use PostgREST directly)
      # Supabase client expects /rest/v1 path, but we'll use Kong for proper routing
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      # Azure Synapse config (if needed)
      AZURE_SYNAPSE_SERVER: ${AZURE_SYNAPSE_SERVER:-celestyaldataplatform-prd.sql.azuresynapse.net}
      AZURE_SYNAPSE_PORT: ${AZURE_SYNAPSE_PORT:-1433}
      AZURE_SYNAPSE_DATABASE: ${AZURE_SYNAPSE_DATABASE:-CDP_Dedicated_SQL_DWH}
      AZURE_SYNAPSE_USERNAME: ${AZURE_SYNAPSE_USERNAME:-RBryer}
      AZURE_SYNAPSE_PASSWORD: ${AZURE_SYNAPSE_PASSWORD:-Cele5tyalrbUser!}
      DATA_SOURCE_PRIORITY: ${DATA_SOURCE_PRIORITY:-supabase}
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    restart: unless-stopped
    networks:
      - talia-network

  # UI (Frontend)
  ui:
    container_name: talia-ui
    build:
      context: ./talia-ui
      dockerfile: Dockerfile
      args:
        # Build-time environment variables (use miniPC IP)
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://192.168.1.120:54321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
        VITE_GRAPHQL_ENDPOINT: ${VITE_GRAPHQL_ENDPOINT:-http://192.168.1.120:4000/graphql}
    ports:
      - "5173:80"  # UI accessible on port 5173
    depends_on:
      graphql-server:
        condition: service_started
      supabase-kong:
        condition: service_started
    restart: unless-stopped
    networks:
      - talia-network

volumes:
  supabase-db-data:
    driver: local
  supabase-storage-data:
    driver: local

networks:
  talia-network:
    driver: bridge
